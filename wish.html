<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Janmashtami 🦚</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="wish-page">

        <div class="wish-overlay"></div>

        <section class="wish-content">

            <div class="krishna-image-container">
                <img
                    src="assets/krishna.png"
                    alt="Lord Krishna"
                    class="krishna-image"
                >
            </div>

            <p class="wish-sanskrit">
                🪷 श्री कृष्ण जन्माष्टमी 🪷
            </p>

            <h1>Happy Janmashtami</h1>

            <p class="wish-message">
                May Lord Krishna fill your life with
                <br>
                love, peace, happiness and prosperity.
            </p>

            <p class="radhe">
                🦚 Radhe Radhe 🦚
            </p>

            <p class="designer">
                Designed by Kumar Soumya Ranjan
            </p>

        </section>

    </main>

    <audio id="krishnaMusic" loop>
        <source src="assets/flute.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>

</body>
</html>
